<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Validation</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <main class="main-container">

            <div class="form-container">
                <div class="header-container">
                    <h1>Create Account</h1>
                    <p>Fill in the details below to get started</p>
                </div>

                <form autocomplete="off">

                    <label for="name">Name</label>
                    <input type="text" autocomplete="off" placeholder="Enter your name" id="name">
                    

                    <label for="email">Email</label>
                    <input type="text" autocomplete="off" placeholder="Enter your email" id="email">
                    

                    <label for="password">Password</label>
                    <input type="password" autocomplete="off" placeholder="Enter your password" id="password">
                    

                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" autocomplete="off" placeholder="Confirm your password" id="confirm-password">
                   

                    <button type="submit" class="form-btn">Create Account</button>
                </form>
            </div>

        </main>

        <script src="script.js"></script>
    </body>
</html>
